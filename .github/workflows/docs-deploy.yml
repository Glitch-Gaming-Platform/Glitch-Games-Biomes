name: Deploy docs to GitHub Pages

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy docs to GitHub Pages
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install Yarn
        run: npm install -g yarn@1

      - name: Configure GitHub Git dependencies
        uses: ./.github/actions/configure-github-git-deps
        with:
          token: ${{ secrets.BIOMES_DEPENDENCY_GITHUB_TOKEN }}

      - name: Install project dependencies
        run: yarn install --frozen-lockfile
      - name: Install docs dependencies
        working-directory: ./docs
        run: yarn install --frozen-lockfile
      - name: Build website
        working-directory: ./docs
        run: yarn build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Contents of "build" are published to the `gh-pages` branch.
          publish_dir: ./docs/build
          # Assign commit authorship to the official GH-Actions bot.
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          cname: docs.biomes.gg

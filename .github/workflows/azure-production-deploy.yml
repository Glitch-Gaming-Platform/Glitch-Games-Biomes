name: Azure production deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional image tag. Defaults to prod-<short sha>."
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-production-deploy
  cancel-in-progress: true

env:
  CI: "1"
  HUSKY: "0"
  HUSKY_SKIP_HOOKS: "1"
  HUSKY_SKIP_INSTALL: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  AZURE_CORE_OUTPUT: none
  PROD_ORIGIN: https://biomes-node-vnet.thankfulfield-9814940f.eastus.azurecontainerapps.io
  ACR_NAME: GlitchGames
  ACR_SERVER: glitchgames.azurecr.io
  IMAGE_REPO: biomes-node
  DOCKER_PLATFORM: linux/amd64
  AZURE_RESOURCE_GROUP: openai-resource-group
  AZURE_CONTAINER_APP: biomes-node-vnet
  GLITCH_TITLE_ID: 42de534c-600f-4228-af9e-b69faef94cce
  GLITCH_API_BASE_URL: https://api.glitch.fun/api
  DOCKER_BUILD_CACHE_FROM: type=local,src=/tmp/.buildx-cache
  DOCKER_BUILD_CACHE_TO: type=local,dest=/tmp/.buildx-cache-new,mode=max
  HARTHMERE_SKIP_WORLD_SYNC_RECONCILIATION: "1"

jobs:
  deploy:
    name: Build, push, and deploy
    if: github.repository == 'Glitch-Gaming-Platform/Glitch-Games-Biomes'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Yarn
        run: npm install -g yarn@1

      - name: Configure private Git dependencies
        env:
          BIOMES_DEPENDENCY_GITHUB_TOKEN: ${{ secrets.BIOMES_DEPENDENCY_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${BIOMES_DEPENDENCY_GITHUB_TOKEN:-}" ]; then
            echo "Missing GitHub production environment secret: BIOMES_DEPENDENCY_GITHUB_TOKEN" >&2
            exit 1
          fi
          git_config="$RUNNER_TEMP/gitconfig-private-deps"
          {
            printf '[url "https://x-access-token:%s@github.com/"]\n' "$BIOMES_DEPENDENCY_GITHUB_TOKEN"
            printf '    insteadOf = ssh://git@github.com/\n'
            printf '    insteadOf = git+ssh://git@github.com/\n'
            printf '    insteadOf = git@github.com:\n'
          } > "$git_config"
          echo "GIT_CONFIG_GLOBAL=$git_config" >> "$GITHUB_ENV"

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node20-node-modules-${{ hashFiles('yarn.lock') }}-production-deploy-cache
          restore-keys: |
            ${{ runner.os }}-node20-node-modules-

      - name: Install dependencies
        run: yarn install --production=false --frozen-lockfile --non-interactive

      - name: Restore Docker layer cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check required Azure OIDC secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub production environment secret: $name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Allow Azure CLI extension auto-install
        run: az config set extension.use_dynamic_install=yes_without_prompt

      - name: Deploy production Container App
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_TAG:-}" ]; then
            TAG="$REQUESTED_TAG"
          else
            TAG="prod-${GITHUB_SHA::12}"
          fi
          scripts/glitch/deploy-production-local-redis-smoke.sh --push --tag "$TAG"

      - name: Promote refreshed Docker layer cache
        if: always()
        run: |
          set -euo pipefail
          if [ -d /tmp/.buildx-cache-new ]; then
            rm -rf /tmp/.buildx-cache
            mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          fi

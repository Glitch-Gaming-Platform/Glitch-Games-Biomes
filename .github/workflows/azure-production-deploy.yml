name: Azure production deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional image tag. Defaults to prod-<short sha>."
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-production-deploy
  cancel-in-progress: true

env:
  CI: "1"
  HUSKY: "0"
  HUSKY_SKIP_HOOKS: "1"
  HUSKY_SKIP_INSTALL: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  AZURE_CORE_OUTPUT: none
  PROD_ORIGIN: https://biomes-node-vnet.thankfulfield-9814940f.eastus.azurecontainerapps.io
  ACR_NAME: GlitchGames
  ACR_SERVER: glitchgames.azurecr.io
  IMAGE_REPO: biomes-node
  DOCKER_PLATFORM: linux/amd64
  AZURE_RESOURCE_GROUP: openai-resource-group
  AZURE_CONTAINER_APP: biomes-node-vnet
  GLITCH_TITLE_ID: 42de534c-600f-4228-af9e-b69faef94cce
  GLITCH_API_BASE_URL: https://api.glitch.fun/api
  DOCKER_BUILD_CACHE_FROM: type=local,src=/tmp/.buildx-cache
  DOCKER_BUILD_CACHE_TO: type=local,dest=/tmp/.buildx-cache-new,mode=max
  HARTHMERE_SKIP_WORLD_SYNC_RECONCILIATION: "1"
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  deploy:
    name: Build, push, and deploy
    if: github.repository == 'Glitch-Gaming-Platform/Glitch-Games-Biomes'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install dependencies
        uses: ./.github/actions/cached-yarn-install
        timeout-minutes: 45
        with:
          token: ${{ secrets.BIOMES_DEPENDENCY_GITHUB_TOKEN }}

      - name: Install Bazelisk
        run: npm install -g @bazel/bazelisk

      - name: Restore production asset cache
        id: production-asset-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            public/buckets
            snapshot_backup.json
          key: ${{ runner.os }}-production-data-snapshot-${{ hashFiles('scripts/b/data_snapshot.py') }}

      - name: Restore production compiler cache
        id: production-compiler-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .next/cache
            node_modules/.cache/webpack
          key: ${{ runner.os }}-production-compiler-${{ hashFiles('yarn.lock', 'next.config.js', 'server.webpack.config.cjs', 'tsconfig.next.json', 'tsconfig.server.json') }}
          restore-keys: |
            ${{ runner.os }}-production-compiler-

      - name: Restore Docker layer cache
        id: docker-buildx-cache
        uses: actions/cache/restore@v5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile.biomes', 'Dockerfile', 'scripts/glitch/deploy-production-local-redis-smoke.sh', 'yarn.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile.biomes', 'Dockerfile', 'scripts/glitch/deploy-production-local-redis-smoke.sh', 'yarn.lock') }}-
            ${{ runner.os }}-buildx-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check required Azure OIDC secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub production environment secret: $name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Allow Azure CLI extension auto-install
        run: az config set extension.use_dynamic_install=yes_without_prompt

      - name: Deploy production Container App
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_TAG:-}" ]; then
            TAG="$REQUESTED_TAG"
          else
            TAG="prod-${GITHUB_SHA::12}"
          fi
          scripts/glitch/deploy-production-local-redis-smoke.sh --push --tag "$TAG"

      - name: Promote refreshed Docker layer cache
        id: promote-buildx-cache
        if: always()
        run: |
          set -euo pipefail
          if [ -d /tmp/.buildx-cache-new ]; then
            rm -rf /tmp/.buildx-cache
            mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          fi
          if [ -d /tmp/.buildx-cache ]; then
            echo "cache_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "cache_present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check refreshed production asset cache
        id: refreshed-production-asset-cache
        if: always()
        run: |
          set -euo pipefail
          if [ -d public/buckets ] || [ -f snapshot_backup.json ]; then
            echo "cache_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "cache_present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save production asset cache
        if: always() && steps.refreshed-production-asset-cache.outputs.cache_present == 'true' && steps.production-asset-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            public/buckets
            snapshot_backup.json
          key: ${{ runner.os }}-production-data-snapshot-${{ hashFiles('scripts/b/data_snapshot.py') }}

      - name: Check refreshed production compiler cache
        id: refreshed-production-compiler-cache
        if: always()
        run: |
          set -euo pipefail
          if [ -d .next/cache ] || [ -d node_modules/.cache/webpack ]; then
            echo "cache_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "cache_present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save production compiler cache
        if: always() && steps.refreshed-production-compiler-cache.outputs.cache_present == 'true' && steps.production-compiler-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            .next/cache
            node_modules/.cache/webpack
          key: ${{ runner.os }}-production-compiler-${{ hashFiles('yarn.lock', 'next.config.js', 'server.webpack.config.cjs', 'tsconfig.next.json', 'tsconfig.server.json') }}

      - name: Save Docker layer cache
        if: always() && steps.promote-buildx-cache.outputs.cache_present == 'true' && steps.docker-buildx-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile.biomes', 'Dockerfile', 'scripts/glitch/deploy-production-local-redis-smoke.sh', 'yarn.lock') }}-${{ github.sha }}

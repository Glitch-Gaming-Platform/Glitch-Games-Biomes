name: ts-eslint-ci

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/node/**"
      - ".github/workflows/ts-ci.yml"
      - ".github/actions/**"
      - "yarn.lock"

permissions:
  id-token: write # Needed for gcloud auth.
  contents: read

jobs:
  ts-eslint-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: git lfs pull
        uses: ./.github/actions/cached-lfs-pull
      - name: yarn install
        uses: ./.github/actions/cached-yarn-install
        with:
          token: ${{ secrets.BIOMES_DEPENDENCY_GITHUB_TOKEN }}
      - name: bazel setup
        uses: ./.github/actions/bazel
      - name: Select Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Create/activate virtual environment.
        run: python3 -m venv .venv && echo "$(pwd)/.venv/bin" >> $GITHUB_PATH
      - run: ./b ts-deps build
      - name: Restore eslint cache.
        id: eslint-cache
        uses: ./.github/actions/cached-eslint
      - run: ./b lint ts --cache-strategy content
      - name: Check refreshed eslint cache
        id: refreshed-eslint-cache
        run: |
          set -euo pipefail
          if [ -d .next/cache/eslint ]; then
            echo "cache_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "cache_present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Save eslint cache
        if: steps.refreshed-eslint-cache.outputs.cache_present == 'true' && steps.eslint-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ./.next/cache/eslint
          key: ${{ runner.os }}-eslintcache-${{ hashFiles('./yarn.lock') }}

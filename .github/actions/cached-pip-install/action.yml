name: "Cached pip install"

description: "Run 'pip install', if out-of-date"

branding:
  icon: "download"
  color: "green"

runs:
  using: "composite"
  steps:
    - name: Select Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    # We create and use a virtual environment so that we can just cache this
    # entire directory and re-use it if our Python environment doesn't change.
    - name: Create virtual environment.
      run: python3 -m venv .venv
      shell: bash

    # We "activate" the virtual environment here by adding it to our PATH. This
    # will apply for all subsequent steps.
    - name: Activate the virtual environment.
      run: echo "$(pwd)/.venv/bin" >> $GITHUB_PATH
      shell: bash

    - name: Restore pip install cache
      uses: actions/cache/restore@v5
      id: pip-cache
      with:
        path: ./.venv
        # We reference '.venv/pyvenv.cfg' in the key here since it contains
        # the Python version that we're using.
        key: ${{ runner.os }}-pip-${{ hashFiles('.venv/pyvenv.cfg') }}-${{ hashFiles('./requirements.txt', './voxeloo/**') }}

    - run: python -m pip install --upgrade pip setuptools wheel
      if: steps.pip-cache.outputs.cache-hit != 'true'
      shell: bash

    - run: python -m pip install -r requirements.txt
      if: steps.pip-cache.outputs.cache-hit != 'true'
      shell: bash

    # The release Bazel config is portable and does not use --march=native.
    # Modern pip no longer accepts per-install setup flags, so pass the cache
    # choice through the setup.py environment contract instead.
    - run: BIOMES_BAZEL_NO_CACHE=1 python -m pip install --no-build-isolation ./voxeloo -v
      if: steps.pip-cache.outputs.cache-hit != 'true'
      shell: bash

    - name: Save pip install cache
      if: steps.pip-cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        path: ./.venv
        key: ${{ runner.os }}-pip-${{ hashFiles('.venv/pyvenv.cfg') }}-${{ hashFiles('./requirements.txt', './voxeloo/**') }}

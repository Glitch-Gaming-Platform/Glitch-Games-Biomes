name: "Cached yarn install"

description: "Run 'yarn install', if out-of-date"

inputs:
  token:
    description: "Optional token for private GitHub package dependencies."
    required: false

branding:
  icon: "download"
  color: "green"

runs:
  using: "composite"
  steps:
    - name: Configure GitHub Git dependencies
      uses: ./.github/actions/configure-github-git-deps
      with:
        token: ${{ inputs.token }}

    - uses: actions/setup-node@v6
      env:
        ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
      with:
        node-version-file: .nvmrc

    - run: npm install -g yarn@1
      shell: bash

    - name: Capture dependency cache metadata
      id: dependency-cache
      shell: bash
      run: |
        set -euo pipefail
        echo "node_version=$(node --version)" >> "$GITHUB_OUTPUT"

    # node_modules is intentionally cached for this repo because a cold install
    # is much slower than verifying a restored tree. The exact Node version is
    # in the key so native packages are not reused across Node upgrades.
    - name: Restore node_modules cache
      uses: actions/cache/restore@v5
      id: node_modules-cache
      with:
        path: ./node_modules
        key: ${{ runner.os }}-${{ steps.dependency-cache.outputs.node_version }}-node-modules-${{ hashFiles('./yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ steps.dependency-cache.outputs.node_version }}-node-modules-

    - name: Validate restored node_modules cache
      id: node_modules-validation
      if: steps.node_modules-cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if node <<'NODE'
        const fs = require("fs");
        const path = require("path");

        const root = process.cwd();
        const integrityPath = path.join(root, "node_modules/.yarn-integrity");
        if (!fs.existsSync(integrityPath)) {
          throw new Error("node_modules/.yarn-integrity is missing");
        }
        const integrity = JSON.parse(fs.readFileSync(integrityPath, "utf8"));
        if (!String(integrity.systemParams || "").startsWith("linux-")) {
          throw new Error(`node_modules cache was built for ${integrity.systemParams}`);
        }

        const pkg = JSON.parse(fs.readFileSync(path.join(root, "package.json"), "utf8"));
        const dependencyNames = Object.keys({
          ...(pkg.dependencies || {}),
          ...(pkg.devDependencies || {}),
        });
        const missing = dependencyNames.filter((name) => {
          return !fs.existsSync(
            path.join(root, "node_modules", ...name.split("/"), "package.json")
          );
        });
        if (missing.length > 0) {
          throw new Error(`node_modules cache is missing: ${missing.join(", ")}`);
        }

        for (const bin of ["next", "tsc", "webpack"]) {
          const binPath = path.join(root, "node_modules/.bin", bin);
          if (!fs.existsSync(binPath)) {
            throw new Error(`node_modules cache is missing ${binPath}`);
          }
        }
        NODE
        then
          echo "valid=true" >> "$GITHUB_OUTPUT"
        else
          echo "valid=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Install dependencies
      if: steps.node_modules-validation.outputs.valid != 'true'
      run: yarn install --production=false --frozen-lockfile --non-interactive
      shell: bash

    # Ensure we have read access on all files before explicit cache saves.
    - name: Normalize node_modules cache permissions
      run: |
        set -euo pipefail
        if [ -d node_modules ]; then
          chmod u+r -R node_modules
        fi
      shell: bash

    - name: Save node_modules cache
      if: steps.node_modules-cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        path: ./node_modules
        key: ${{ runner.os }}-${{ steps.dependency-cache.outputs.node_version }}-node-modules-${{ hashFiles('./yarn.lock') }}

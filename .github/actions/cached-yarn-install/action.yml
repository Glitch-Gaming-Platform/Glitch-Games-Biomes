name: "Cached yarn install"

description: "Run 'yarn install', if out-of-date"

inputs:
  token:
    description: "Optional token for private GitHub package dependencies."
    required: false

branding:
  icon: "download"
  color: "green"

runs:
  using: "composite"
  steps:
    - name: Configure GitHub Git dependencies
      uses: ./.github/actions/configure-github-git-deps
      with:
        token: ${{ inputs.token }}

    - uses: actions/setup-node@v6
      env:
        ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
      with:
        node-version-file: .nvmrc

    - run: npm install -g yarn@1
      shell: bash

    - name: Capture dependency cache metadata
      id: dependency-cache
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "node_version=$(node --version)"
          echo "yarn_cache_dir=$(yarn cache dir)"
        } >> "$GITHUB_OUTPUT"

    - name: Restore Yarn tarball cache
      uses: actions/cache/restore@v5
      id: yarn-cache
      with:
        path: ${{ steps.dependency-cache.outputs.yarn_cache_dir }}
        key: ${{ runner.os }}-${{ steps.dependency-cache.outputs.node_version }}-yarn-cache-${{ hashFiles('./yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ steps.dependency-cache.outputs.node_version }}-yarn-cache-

    # node_modules is intentionally cached for this repo because a cold install
    # is much slower than verifying a restored tree. The exact Node version is
    # in the key so native packages are not reused across Node upgrades.
    - name: Restore node_modules cache
      uses: actions/cache/restore@v5
      id: node_modules-cache
      with:
        path: ./node_modules
        key: ${{ runner.os }}-${{ steps.dependency-cache.outputs.node_version }}-node-modules-${{ hashFiles('./yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ steps.dependency-cache.outputs.node_version }}-node-modules-

    - name: Install dependencies
      run: yarn install --production=false --frozen-lockfile --non-interactive
      shell: bash

    # Ensure we have read access on all files before explicit cache saves.
    - run: chmod u+r -R node_modules
      shell: bash

    - name: Save Yarn tarball cache
      if: steps.yarn-cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        path: ${{ steps.dependency-cache.outputs.yarn_cache_dir }}
        key: ${{ runner.os }}-${{ steps.dependency-cache.outputs.node_version }}-yarn-cache-${{ hashFiles('./yarn.lock') }}

    - name: Save node_modules cache
      if: steps.node_modules-cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        path: ./node_modules
        key: ${{ runner.os }}-${{ steps.dependency-cache.outputs.node_version }}-node-modules-${{ hashFiles('./yarn.lock') }}

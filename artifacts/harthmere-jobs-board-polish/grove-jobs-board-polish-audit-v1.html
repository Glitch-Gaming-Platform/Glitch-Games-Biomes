  <meta charset="utf-8" />

  <title>Grove Jobs Board Polish Audit</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #172326;
      color: #f7f0dc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 24% 30%, rgba(103, 156, 146, 0.24), transparent 24rem),
        linear-gradient(180deg, #20353a 0%, #121d22 100%);
    }
    .audit-scene {
      display: block;
      inline-size: 100vw;
      block-size: 100vh;
    }
    .audit-label {
      position: fixed;
      inset-block-start: 14px;
      inset-inline-start: 14px;
      max-width: min(440px, calc(100vw - 28px));
      padding: 12px 14px;
      border: 1px solid rgba(255, 224, 142, 0.35);
      border-radius: 8px;
      background: rgba(22, 27, 28, 0.74);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(10px);
    }
    .audit-label h1 {
      margin: 0;
      font-size: 15px;
      letter-spacing: 0;
      line-height: 1.25;
    }
    .audit-label p {
      margin: 5px 0 0;
      color: rgba(247, 240, 220, 0.78);
      font-size: 12px;
      line-height: 1.35;
    }
    .audit-chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-block-start: 9px;
    }
    .audit-chip {
      padding: 4px 7px;
      border: 1px solid rgba(247, 240, 220, 0.18);
      border-radius: 999px;
      background: rgba(247, 240, 220, 0.08);
      color: rgba(247, 240, 220, 0.82);
      font-size: 11px;
      white-space: nowrap;
    }
    @media (max-width: 560px) {
      .audit-label {
        inset-block-start: auto;
        inset-block-end: 12px;
      }
      .audit-label h1 { font-size: 14px; }
      .audit-label p { font-size: 11px; }
    }
  </style>
</head>
